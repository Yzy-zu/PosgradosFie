<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="css/favico.png">
    <title>UMSNH - Registro de Aspirante | Posgrados FIE</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="split-body">
    <div class="split-layout">
        <!-- Panel Izquierdo: Branding Premium -->
        <div class="split-brand-panel">
            <div class="brand-content">
                <div class="brand-logos">
                    <img src="css/fie_logo.png" alt="Logo FIE" class="brand-logo">
                    <img src="css/posgradofie.png" alt="Logo Posgrados FIE" class="brand-logo">
                </div>
                <h1 class="brand-title">Crea tu Cuenta</h1>
                <p class="brand-subtitle">
                    Regístrate con tu correo institucional para ingresar a la plataforma y postularte a los programas de posgrado FIE UMSNH.
                </p>
            </div>
            <!-- Círculos decorativos de fondo -->
            <div class="bg-circle circle-1"></div>
            <div class="bg-circle circle-2"></div>
        </div>

        <!-- Panel Derecho: Formulario Limpio -->
        <div class="split-form-panel">
            <div class="form-container">
                <h2 class="form-title">Registro de Aspirante</h2>
                <p class="form-subtitle">Es rápido y fácil.</p>
                
                <form id="formularioRegistro" class="premium-form" onsubmit="enviarRegistro(event)">
                    <div class="input-group">
                        <label for="reg-correo">Correo Institucional</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon"></i>
                            <input
                                type="email"
                                id="reg-correo"
                                placeholder="ejemplo@umich.mx"
                                required
                                autocomplete="email">
                        </div>
                        <small class="input-help">Debe terminar estrictamente en <strong>@umich.mx</strong></small>
                    </div>

                    <div class="input-group">
                        <label for="reg-password">Contraseña nueva</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input
                                type="password"
                                id="reg-password"
                                placeholder="••••••••"
                                required
                                autocomplete="new-password">
                            <i class="fa-solid fa-eye toggle-pwd" id="toggleRegPassword" onclick="toggleRegPasswordVisibility()" title="Mostrar contraseña"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary-split">
                        Registrarte <i class="fa-solid fa-user-plus"></i>
                    </button>
                </form>

                <div class="split-divider">
                    <span>¿Ya tienes una cuenta?</span>
                </div>

                <a href="login.html" class="btn-secondary-split">
                    Inicia sesión aquí
                </a>
            </div>
        </div>
    </div>

    <!-- Script de control de lógica independiente -->
    <script>
        function toggleRegPasswordVisibility() {
            const pwdInput = document.getElementById('reg-password');
            const toggleIcon = document.getElementById('toggleRegPassword');
            if (!pwdInput || !toggleIcon) return;

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        async function enviarRegistro(event) {
            event.preventDefault();
            const correo = document.getElementById('reg-correo').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value.trim();

            // Validación del dominio institucional
            if (!correo.endsWith('@umich.mx')) {
                alert("⚠️ Registro Restringido:\nDebes utilizar obligatoriamente un correo institucional @umich.mx");
                return;
            }

            try {
                const respuesta = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        correo,
                        password,
                        rol: "ASPIRANTE"
                    })
                });

                const datos = await respuesta.json();

                if (datos.success) {
                    alert("¡Registro exitoso! Por favor, inicia sesión con tu nueva cuenta.");

                    // Redirigir directamente al login prellenando el correo
                    window.location.href = `login.html?correo=${encodeURIComponent(correo)}`;
                } else {
                    alert(datos.mensaje || "Error al procesar el registro del aspirante.");
                }

            } catch (error) {
                console.error("Error en la petición:", error);
                alert("Error de red o el servidor está caído.");
            }
        }
    </script>
</body>

</html>
