<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="css/favico.png">
    <title>UMSNH - Posgrados FIE | Iniciar Sesión</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="split-body">
    <div class="split-layout">
        <!-- Panel Izquierdo: Branding Premium -->
        <div class="split-brand-panel">
            <div class="brand-content">
                <div class="brand-logos">
                    <img src="css/fie_logo.png" alt="Logo FIE" class="brand-logo">
                    <img src="css/posgradofie.png" alt="Logo Posgrados FIE" class="brand-logo">
                </div>
                <h1 class="brand-title">Sistema de Posgrados</h1>
                <p class="brand-subtitle">
                    Gestión académica y proceso de admisión para Maestrías y Doctorados de la Facultad de Ingeniería Eléctrica UMSNH.
                </p>
            </div>
            <!-- Círculos decorativos de fondo -->
            <div class="bg-circle circle-1"></div>
            <div class="bg-circle circle-2"></div>
        </div>

        <!-- Panel Derecho: Formulario Limpio -->
        <div class="split-form-panel">
            <div class="form-container">
                <h2 class="form-title">Bienvenido de nuevo</h2>
                <p class="form-subtitle">Ingresa a tu cuenta institucional para continuar</p>
                
                <form id="loginForm" class="premium-form">
                    <div class="input-group">
                        <label for="usuario">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon"></i>
                            <input
                                type="email"
                                id="usuario"
                                placeholder="ejemplo@umich.mx"
                                required
                                autocomplete="email">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input
                                type="password"
                                id="password"
                                placeholder="••••••••"
                                required
                                autocomplete="current-password">
                            <i class="fa-solid fa-eye toggle-pwd" id="togglePassword" title="Mostrar contraseña"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary-split">
                        Iniciar sesión <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div class="split-divider">
                    <span>¿Aún no eres parte?</span>
                </div>

                <a href="registro.html" class="btn-secondary-split">
                    Regístrate como aspirante
                </a>
            </div>
        </div>
    </div>

    <!-- Lógica de control del login -->
    <script src="js/login.js"></script>

</body>

</html>
